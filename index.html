<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOWDEX.io — minimal experimental itch</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="main-container">
    <header class="site-header">
      <h1>LOWDEX.io</h1>
      <div class="header-desc">
        <span class="fake-api-indicator"></span> itch.io API • live feed
      </div>
    </header>

    <div class="section-label">
      <h2>━ featured games</h2>
      <div class="api-badge">⚡ live from itch.io</div>
    </div>

    <div id="game-grid" class="game-grid">
      <div class="loader">loading content ...</div>
    </div>

    <div class="feedback-section">
      <div class="section-label">
        <h2>━ feedback</h2>
        <div class="api-badge">✉️ contact us</div>
      </div>
      
      <form id="feedback-form" class="feedback-form">
        <div class="form-group">
          <label for="name">Nombre</label>
          <input type="text" id="name" name="name" required placeholder="Tu nombre">
        </div>
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" required placeholder="tu@email.com">
        </div>
        <div class="form-group">
          <label for="message">Tu Criterio / Mensaje</label>
          <textarea id="message" name="message" required placeholder="¿Qué opinas de la plataforma?"></textarea>
        </div>
        <button type="submit" class="submit-btn">Enviar Feedback</button>
        <div id="form-status" class="form-status"></div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
